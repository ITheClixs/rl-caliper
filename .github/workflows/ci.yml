name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check src tests experiments analysis
      - name: Test
        run: uv run pytest --cov=caliper --cov-report=term-missing
