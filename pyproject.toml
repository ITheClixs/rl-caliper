[project]
name = "caliper"
version = "0.1.0"
description = "Measurement tools for the batch-size and step-size scaling of RL post-training"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Mehmet Demir Güven", email = "dgueven@student.ethz.ch" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.6",
    "polars>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
mlx = ["mlx>=0.22", "mlx-lm>=0.21"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
caliper = "caliper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E741"]
